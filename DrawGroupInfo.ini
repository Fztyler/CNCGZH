; modCURSOR -- MOD HOOK -- loose Data\INI files override INIZH.big of the same path.
; modCURSOR -- Selected-unit group number drawing.
; modCURSOR -- Do not put a stub here: a short file REPLACES the whole packed INI.
;

; DrawGroupInfo for drawing the numbers over Drawables that are in control groups.

DrawGroupInfo
  UsePlayerColor = No
  ColorForText = R:255 G:255 B:255 A:255
  ColorForTextDropShadow = R:0 G:0 B:0 A:255
  
  DropShadowOffsetX = 1
  DropShadowOffsetY = 1

  FontName = "Arial"
  FontSize = 10
  FontIsBold = No

  DrawPositionXPercent  = -20%
  DrawPositionYPixel    = -10
End
